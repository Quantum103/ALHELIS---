upstream auth_service_http {
    server auth-service:8080;
}

upstream auth_service_grpc {
    server auth-service:50052;
}

upstream user_service {
    server user-service:50051;
}

server {
    listen 80;
    server_name localhost;

    # 1. REST API: Аутентификация
    location /api/auth/ {
        proxy_pass http://auth_service_http/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. REST API: Пользователи
    location /api/users/ {
        proxy_pass http://user_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. gRPC: Межсервисное общение (ЗДЕСЬ БЫЛА ОШИБКА)
    # Я добавил недостающий блок "location", теперь Nginx не будет падать
    location /alhelis.AlhelisService/ {
        grpc_pass grpc://auth_service_grpc;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Статика: Dashboard
    location /dashboard {
        root /usr/share/nginx/html;
        try_files /dashboard.html /dashboard/index.html =404;
    }

    # 5. Статика: Главная страница
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}