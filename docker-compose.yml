services:
  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: coffee_user
      POSTGRES_PASSWORD: coffee_password
      POSTGRES_DB: menu_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_user -d menu_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    expose:
      - "50052"
    environment:
      DB_HOST: postgres_db
      DB_PORT: "5432"
      DB_USER: coffee_user
      DB_PASSWORD: coffee_password
      DB_NAME: menu_db
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - app-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    expose:
      - "50051"
    environment:
      DB_HOST: postgres_db
      DB_PORT: "5432"
      DB_USER: coffee_user
      DB_PASSWORD: coffee_password
      DB_NAME: menu_db
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - app-network

  gateway:
    build: ./gateway
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service   # 👈 ВАЖНО: Nginx НЕ запустится, пока не поднимутся эти сервисы
      - user-service
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge